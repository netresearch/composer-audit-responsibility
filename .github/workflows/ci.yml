name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  php-ci:
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    with:
      php-versions: '["8.1", "8.2", "8.3", "8.4", "8.5"]'
      run-phpstan: true
      run-phpunit: true
      run-cs-fixer: true
      cs-fixer-cmd: "composer lint"
